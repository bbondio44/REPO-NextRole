spring:
  application:
    name: nextrole-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextrole}
    username: ${SPRING_DATASOURCE_USERNAME:nextrole}
    password: ${SPRING_DATASOURCE_PASSWORD:nextrole_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
nextrole:
  explainability:
    provider: ${EXPLAINABILITY_PROVIDER:openrouter}
    model: ${EXPLAINABILITY_MODEL:baidu/ernie-5.5-flash-preview:free}
    prompt-version: ${EXPLAINABILITY_PROMPT_VERSION:explainability-v5}
    openrouter-url: ${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    connect-timeout: ${EXPLAINABILITY_CONNECT_TIMEOUT:3s}
    response-timeout: ${EXPLAINABILITY_RESPONSE_TIMEOUT:45s}
    max-output-tokens: ${EXPLAINABILITY_MAX_OUTPUT_TOKENS:5000}
    lease: ${EXPLAINABILITY_GENERATION_LEASE:2m}
    poll-interval: ${EXPLAINABILITY_POLL_INTERVAL:2s}
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: nextrole-api
    access-minutes: 15
    refresh-days: 14
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
